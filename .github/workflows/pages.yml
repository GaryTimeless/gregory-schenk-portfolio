name: Publish portfolio and customer preview
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Three attempts on the planned removal day. GitHub schedules may be delayed.
    - cron: '51 14,17,20 8 11 *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build public site
        run: python3 scripts/build_pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
